  name: Get businesses by Google Place ID
  summary: Get up to 100 full business records by Google Place ID
  input:
    bodyType: json
    note: The upstream request body is a raw JSON array of 1 to 100 Google Place ID strings.
  test_request: {body: [ChIJ00000000000000000000000]}
  cost: *lookup_record_cost
  verified: '2026-09-17'
  example_response: examples/openmart.businesses.lookup.google-place.json
  docs_url: https://app.openmart.com/api-docs

