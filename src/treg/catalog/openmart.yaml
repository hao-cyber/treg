    body:
      tasks: {type: array, items: {type: object, additionalProperties: true}, minItems: 1, maxItems: 100}
  test_request: {body: {tasks: [{website: example.invalid, max_k: 1}]}}
  cost:
    type: per_result
    value: 11
    currency: credit
    per: 1
    unit: result
    source: docs
