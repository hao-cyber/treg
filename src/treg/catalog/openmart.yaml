# Openmart API. Live-verified 2026-09-17 with synthetic inputs.
# Synchronous data reads whose price and returned-record shape are proven can use either a team's
# own key or treg's metered platform key. Openmart rounds 0.3-credit record prices up to whole
# credits per operation; the call runtime applies that provider-specific rule and caps shared-key
# requests at 25 records. Async lifecycles, account mutations, and unresolved prices remain
# BYOK-only. The shared balance endpoint is internal capacity infrastructure, not a tool.
provider: openmart
source:
  docs: https://app.openmart.com/api-docs
  curated: '2026-09-17'
pricing_url: https://www.openmart.com/pricing
limits: Search, enrich, and task reads are documented at 20 requests/second; technology tasks at 15; other batch enrichment at 25.
proposed_capabilities:
  companies.businesses.search: Search physical business locations.
  companies.businesses.search.ids: Search and return only provider business IDs.
  companies.lookup: Retrieve company records by provider identifier.
  companies.technologies: Detect technologies used by a company.
  companies.email.find: Find company-level email addresses.
  companies.tasks.status: Read an asynchronous company-task batch status.
  companies.tasks.list: List task identifiers in an asynchronous company batch.
  companies.tasks.get: Read one asynchronous company-task result.
  companies.deny-rules.create: Add private company-account deny rules.
  companies.deny-rules.check: Check private company-account deny rules.
  companies.deny-rules.delete: Delete private company-account deny rules.
  people.find: Find people associated with a company.

endpoints:
- id: openmart.businesses.search
  domain: companies
  capability: companies.businesses.search
  platform: companies
  scope: any_account
  method: POST
  path: /api/v1/search
  name: Search businesses
  summary: Search local businesses with text, location, category, and attribute filters
  input: &search_input
    bodyType: json
    note: Treat a returned row with match_score 0 as no meaningful match; a live nonsense query returned an unrelated fallback row at that score.
    body:
      query: {type: string}
      limit: {type: integer, min: 1, max: 1000}
      estimate_total: {type: boolean}
  test_request: {body: {query: treg-nonexistent-20260917, limit: 1, estimate_total: true}}
  cost:
    type: per_result
    value: 0.3
    currency: credit
    per: 1
    unit: record
    source: docs
    source_url: https://www.openmart.com/pricing
    checked: '2026-09-17'
    confidence: verified
    note: Openmart support confirmed 3 credits per 10 returned records, rounded up per operation; the effective charge is ceil(0.3 × returned records), and zero records cost zero. Ten live one-result calls each deducted one whole credit. Shared-key calls require an explicit limit from 1 to 25; own-key calls keep the upstream limit. Direct callers should treat match_score 0 as a miss.
  verified: '2026-09-17'
  example_response: examples/openmart.businesses.search.json
  docs_url: https://app.openmart.com/api-docs

- id: openmart.businesses.search.ids
  domain: companies
  capability: companies.businesses.search.ids
  platform: companies
  scope: any_account
  method: POST
  path: /api/v1/search/only_ids
  name: Search business IDs
  summary: Search businesses and return only Openmart IDs
  input: *search_input
  test_request: {body: {query: treg-nonexistent-20260917, limit: 1}}
  cost:
    type: per_result
    value: null
    currency: credit
    per: 1
    unit: result
    source: observed
    source_url: https://app.openmart.com/api-docs
    checked: '2026-09-17'
    confidence: unknown
    note: Documentation says reduced billing; live 1-row, 10-row, and cursor calls moved no whole credit, so no fractional rate is claimed.
  platform_blocked: The upstream rate is unresolved; connect your own Openmart key.
  verified: '2026-09-17'
  example_response: examples/openmart.businesses.search.ids.json
  docs_url: https://app.openmart.com/api-docs

- id: openmart.businesses.lookup.openmart
  domain: companies
  capability: companies.lookup
  platform: companies
  scope: any_account
  method: GET
  path: /api/v1/business_records/list/openmart_id
  name: Get businesses by Openmart ID
  summary: Get up to 100 full business records by Openmart ID
  input:
    bodyType: json
    note: The upstream request body is a raw JSON array of 1 to 100 Openmart ID strings.
  # Openmart documents a JSON array on GET. Keep it in the input contract, but omit it from the
  # generated smoke command because treg intentionally never prints GET commands with bodies.
  test_request: {body: [00000000-0000-4000-8000-000000000001]}
  cost: &lookup_record_cost
    type: per_result
    value: 0.3
    currency: credit
    per: 1
    unit: record
    source: docs
    source_url: https://www.openmart.com/pricing
    checked: '2026-09-17'
    confidence: documented
    note: Full company records use the same ceil(0.3 × returned records) per-operation charge; omitted IDs are free because the response map contains no value for them. Shared-key calls accept at most 25 IDs; own-key calls keep the upstream limit.
  verified: '2026-09-17'
  example_response: examples/openmart.businesses.lookup.openmart.json
  docs_url: https://app.openmart.com/api-docs

- id: openmart.businesses.lookup.google-place
  domain: companies
  capability: companies.lookup
